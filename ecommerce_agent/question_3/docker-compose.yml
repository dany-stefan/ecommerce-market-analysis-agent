version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: question_3/Dockerfile
    container_name: market_analysis_api
    ports:
      - "8000:8000"
    environment:
      - VERBOSE_LOGGING=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
    command: python api.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - agent_network

networks:
  agent_network:
    driver: bridge
