# Docker Compose Configuration for E-commerce Market Analysis Agent
# Question 1: Containerized deployment with multiple service modes

version: '3.8'

services:
  # ============================================================================
  # API Server Mode (Primary - Question 1 REST API)
  # ============================================================================
  api:
    build:
      context: ..
      dockerfile: question_3/Dockerfile
    container_name: market_analysis_api
    ports:
      - "8000:8000"
    volumes:
      - ../reports:/app/reports
      - ../logs:/app/logs
    environment:
      - VERBOSE_LOGGING=true
      - MAX_ITERATIONS=5
      - API_HOST=0.0.0.0
      - API_PORT=8000
    command: python api.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - agent_network
    
    # CrewAI Alternative (commented):
    # If using CrewAI framework, same Docker setup but different command:
    # command: python crewai_api.py
    # CrewAI benefits: Built-in API endpoints, automatic agent coordination

  # ============================================================================
  # Report Generator Mode (Batch Processing)
  # ============================================================================
  batch:
    build: .
    container_name: market_analysis_batch
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - VERBOSE_LOGGING=true
      - MAX_ITERATIONS=5
    command: python generate_example_reports.py
    profiles:
      - batch
    networks:
      - agent_network

  # ============================================================================
  # Interactive Demo Mode
  # ============================================================================
  demo:
    build: .
    container_name: market_analysis_demo
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - VERBOSE_LOGGING=true
    command: python main.py
    profiles:
      - demo
    networks:
      - agent_network

  # ============================================================================
  # Test Runner Mode
  # ============================================================================
  test:
    build: .
    container_name: market_analysis_test
    volumes:
      - ./reports:/app/reports
      - .:/app
    environment:
      - VERBOSE_LOGGING=true
    command: python -m pytest tests/ -v --cov=src --cov-report=html
    profiles:
      - test
    networks:
      - agent_network

  # ============================================================================
  # Optional: Redis for Job Queue (Async Processing)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: market_analysis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    profiles:
      - production
    networks:
      - agent_network
    
    # For production async job processing
    # Python: pip install redis celery
    # CrewAI Alternative: Built-in task queue management

  # ============================================================================
  # Optional: Nginx Reverse Proxy (Production)
  # ============================================================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: market_analysis_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #   profiles:
  #     - production
  #   networks:
  #     - agent_network

# ============================================================================
# Networks
# ============================================================================
networks:
  agent_network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  redis_data:
    driver: local
